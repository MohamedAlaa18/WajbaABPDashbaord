<section *ngIf="offer">
  <!-- Navigation Buttons -->
  <div class="btn-group w-100 mb-3">
    <button class="btn btn-outline-secondary" [ngClass]="{'btn-primary': activeSection === 'information'}"
      (click)="activeSection = 'information'">
      Information
    </button>
    <button class="btn btn-outline-secondary" [ngClass]="{'btn-primary': activeSection === 'image'}"
      (click)="activeSection = 'image'">
      Image
    </button>
    <button *ngIf="offer.items.length != 0" class="btn btn-outline-secondary"
      [ngClass]="{'btn-primary': activeSection === 'items'}" (click)="activeSection = 'items'">
      Items
    </button>
    <button *ngIf="offer.categories.length != 0" class="btn btn-outline-secondary"
      [ngClass]="{'btn-primary': activeSection === 'categories'}" (click)="activeSection = 'categories'">
      Categories
    </button>
  </div>

  <div class="border border-danger bg-white p-3">
    <!-- Information Section -->
    <div *ngIf="activeSection === 'information' && offer" class="section mb-4">
      <div class="info">
        <div class="row mb-3">
          <div class="col-md-6">
            <p><strong>Name:</strong> {{ offer.name }}</p>
          </div>
          <div class="col-md-6">
            <p><strong>Discount:</strong> {{ (offer.discountPercentage).toFixed(2) }}%</p>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <p><strong>Start Day:</strong> {{ offer.startDate }}</p>
          </div>
          <div class="col-md-6">
            <p><strong>Status:</strong>
              <span [ngClass]="offer.status === 1 ? 'text-success' : 'text-danger'">
                {{ offer.status === 1 ? 'Active' : 'Inactive' }}
              </span>
            </p>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <p><strong>End Day:</strong> {{ offer.endDate }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Image Section -->
    <div *ngIf="activeSection === 'image'" class="section mb-4">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <img [src]="offer.imageUrl" alt="Offer Image" class="img-thumbnail" style="width: 200px; height: auto;">
        <label class="btn btn-danger">
          Update Image
          <input type="file" id="image" (change)="onFileSelect($event)" hidden>
        </label>
      </div>
    </div>

    <!-- Items Section -->
    <div *ngIf="activeSection === 'items' && offer.items.length != 0" class="section mb-4">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of offer.items; let isOdd = odd" [ngClass]="{'table-secondary': isOdd}">
            <td>{{ item.name }}</td>
            <td>{{ item.price }}</td>
            <td>
              <button class="btn btn-outline-danger btn-sm" (click)="openConfirmDeleteItemModal(item.id)">
                <img src="assets/images/delete.svg" alt="delete" width="16">
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Categories Section -->
    <div *ngIf="activeSection === 'categories' && offer.categories.length != 0" class="section mb-4">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let category of offer.categories; let isOdd = odd" [ngClass]="{'table-secondary': isOdd}">
            <td>{{ category.name }}</td>
            <td>
              <button class="btn btn-outline-danger btn-sm" (click)="openConfirmDeleteCategoryModal(category.id)">
                <img src="assets/images/delete.svg" alt="delete" width="16">
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
